[package]
name = "deboa-multipart"
version = "0.1.0-beta.1"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/deboa-client/deboa-multipart"
homepage = "https://github.com/deboa-client/deboa"
description = "Utilities for handling multipart form with deboa"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "multipart", "form", "client"]
publish = true
rust-version = "1.85.0"

[features]
default = ["multi-threaded"]
multi-threaded = []
single-threaded = []

[dependencies]
async-lock = "3.4.2"
async-stream = "0.3.6"
base64 = { version = "0.23.0" }
bytes = { version = "1.11" }
deboa = { version = "0.1.5-beta.7" }
futures = { version = "0.3.31", default-features = false }
http-body = "1"
http-body-util = "0.1"
rand = { version = "0.10.1", default-features = false, features = [
    "std",
    "thread_rng",
] }

[dev-dependencies]
futures-util = "0.3.32"
macro_rules_attribute = { version = "0.2.2", default-features = false }
smol = { version = "2.0.2", default-features = false }
smol-macros = { version = "0.1.1", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = [
    "fs",
    "macros",
    "rt-multi-thread",
], default-features = false }
tokio-util = { version = "0.7.20", features = ["io"], default-features = false }
